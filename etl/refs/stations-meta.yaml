# Curated Wisła-basin station set and hand-maintained metadata for the
# Atlas of Polish Rivers v1. Section-1 fields (catchment area, regime, ...)
# are intentionally null until verified against a reference publication;
# null renders as an omitted row on the station page.
#
# `name`/`river` override data-derived values when set; otherwise the
# registry uses the IMGW snapshot (active stations) or the archive/list
# spelling (historical ones).
basin: Wisła
stations:
  # --- Wisła main stem, downstream order ---
  - id: "149180140"
    name: Wisła   # source station
    river: Wisła
    river_key: wisla
  - id: "149180100"
    name: Skoczów
    river: Wisła
    river_key: wisla
  - id: "150190340"
    name: Kraków-Bielany
    river: Wisła
    river_key: wisla
  - id: "150210170"
    name: Sandomierz
    river: Wisła
    river_key: wisla
  - id: "152210010"
    name: Warszawa   # the station mocked in mocks/single.html
    river: Wisła
    river_key: wisla
  - id: "152200110"
    name: Modlin   # Narew confluence junction
    river: Wisła
    river_key: wisla
  - id: "152199995"
    name: Płock
    river: Wisła
    river_key: wisla
  - id: "153180090"
    name: Toruń
    river: Wisła
    river_key: wisla
  - id: "154180220"
    name: Gdańska Głowa   # downstream end of the main line
